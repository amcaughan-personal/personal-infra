name: format-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: formatting (${{ matrix.root }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: aws
            terraform_modules_dir: infra/aws/terragrunt/modules
            terragrunt_working_dir: infra/aws/terragrunt
            # Bash check scans every tracked .sh in the repo, so run it once
            run_bash_syntax_check: true
          - root: github
            terraform_modules_dir: infra/github/terragrunt/modules
            terragrunt_working_dir: infra/github/terragrunt
            run_bash_syntax_check: false
    uses: amcaughan-personal/shared_workflows/.github/workflows/format-check.yml@273a9094a7b69df46282bba66619b76355a8d662
    with:
      terraform_modules_dir: ${{ matrix.terraform_modules_dir }}
      terragrunt_working_dir: ${{ matrix.terragrunt_working_dir }}
      run_bash_syntax_check: ${{ matrix.run_bash_syntax_check }}
