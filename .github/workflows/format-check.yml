name: format-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: aws
            terraform_modules_dir: infra/terragrunt/modules
            terragrunt_working_dir: infra/terragrunt
            # Bash check scans every tracked .sh in the repo, so run it once
            run_bash_syntax_check: true
          - root: github
            terraform_modules_dir: infra/github/terragrunt/modules
            terragrunt_working_dir: infra/github/terragrunt
            run_bash_syntax_check: false
    uses: amcaughan-personal/shared_workflows/.github/workflows/format-check.yml@06e761debb02b5e535279a744f761acd3c933e83
    with:
      terraform_modules_dir: ${{ matrix.terraform_modules_dir }}
      terragrunt_working_dir: ${{ matrix.terragrunt_working_dir }}
      run_bash_syntax_check: ${{ matrix.run_bash_syntax_check }}
      # Keep in sync with TERRAFORM_VERSION / TERRAGRUNT_VERSION in local-dev/docker/Dockerfile
      terraform_version: "1.14.2"
      terragrunt_version: "v0.94.0"
