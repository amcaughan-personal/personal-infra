# Who can approve deploys to any repo's production environment.
production_reviewers:
  - amcaughan

repositories:
  data-simulator-api:
    # TEMP-IMPORT: today's settings, removed in the standardizing step
    description: "An API designed to be used to simulate generic sorts of data for testing"
    has_projects: true
    has_wiki: true
    secret_scanning: false
    secret_scanning_push_protection: false
    rulesets:
      - protected_main
      - release_tags
    # Deploys from main only, after approval; its AWS deploy role trusts only this environment.
    production_environment: true
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  data-simulator-elt:
    # TEMP-IMPORT: today's settings, removed in the standardizing step
    description: "Sample ELT job that reads from my data-simulator-API"
    has_projects: true
    has_wiki: true
    secret_scanning: false
    secret_scanning_push_protection: false
    rulesets:
      - protected_main
      - release_tags
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "unit-tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  personal_infra:
    # TEMP-IMPORT: today's settings, removed in the standardizing step
    description: "AWS Infra stuff for my personal account"
    has_projects: true
    secret_scanning: false
    secret_scanning_push_protection: false
    rulesets:
      - protected_main
      - release_tags
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting (aws) / formatting"
      - "formatting (github) / formatting"
      - "unit-tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  shared_workflows:
    # TEMP-IMPORT: today's settings, removed in the standardizing step
    has_projects: true
    has_wiki: true
    allow_merge_commit: true
    delete_branch_on_merge: false
    vulnerability_alerts: false
    secret_scanning: false
    secret_scanning_push_protection: false
    rulesets:
      - protected_main
      - release_tags
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "actionlint / actionlint"
      - "tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"
