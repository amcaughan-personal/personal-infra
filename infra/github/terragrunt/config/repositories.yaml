# Who approves deploys to environments with `approval: true`.
deploy_reviewers:
  - amcaughan

# Each repo gets the org's standard settings and Protected Main (see modules/repositories);
# set only what differs. A new entry creates the repo. To start from the template, add
# `template: repo-template`; add required_checks once its workflows have run on a PR.
repositories:
  data-simulator-api:
    description: "Synthetic data API: describe your columns and distributions, get realistic rows or an endless stream. FastAPI on Lambda, CloudFront, canary deploys"
    homepage_url: "https://amcaughan-personal.github.io/data-simulator-api/"
    topics: [synthetic-data, fastapi, aws-lambda, cloudfront, terraform, terragrunt]
    pages: true # the static API reference
    # Both deploy from main only. Each environment's AWS deploy role trusts only jobs in
    # that environment. Infra applies from main run in infra-*; production applies wait
    # for approval.
    environments:
      staging: {}
      production:
        approval: false # set to true to require a reviewer before production deploys
      infra-staging: {}
      infra-production:
        approval: true
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  data-simulator-elt:
    description: "Hourly ingest of the data-simulator API's payments feed into S3, queryable in Athena"
    topics: [data-engineering, elt, aws-lambda, s3, athena, glue, terragrunt]
    # Code deploys from main only, dev first. Each environment's AWS deploy role
    # trusts only jobs in that environment.
    #
    # Infra applies from main run in the infra-* environments, so code deploy jobs can't
    # assume the apply role (and the reverse). Production applies wait for approval.
    environments:
      dev: {}
      production:
        approval: false # set to true to require a reviewer before production deploys
      infra-dev: {}
      infra-production:
        approval: true
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  personal-infra:
    description: "AWS account baseline (security alerts, cost guardrails, CI roles) and this GitHub org's settings, as Terraform"
    topics: [terraform, terragrunt, aws, github-actions, oidc]
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting (aws) / formatting"
      - "formatting (github) / formatting"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  shared-workflows:
    # Every merge is tagged (v1.2.3) so other repos' Dependabot can bump their pins.
    releases: true
    description: "Reusable GitHub Actions workflows: Terragrunt plan and apply, Python checks, security scans"
    topics: [github-actions, reusable-workflows, terragrunt, devsecops]
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "actionlint / actionlint"
      - "tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  data-simulator-analytics:
    description: "dbt models (bronze, silver, gold) on Athena over the ELT's payments data, with a daily dashboard"
    topics: [dbt, athena, analytics-engineering, data-engineering, vega-lite]
    homepage_url: "https://amcaughan-personal.github.io/data-simulator-analytics/"
    template: repo-template
    pages: true # the dashboard
    # The dbt runner deploys from main only, dev first; the dashboard's data refresh runs in
    # `dashboard`. Each environment's AWS role trusts only jobs in that environment.
    # Infra applies from main run in infra-*, apart from the deploy jobs; production
    # applies wait for approval.
    environments:
      dev: {}
      production:
        approval: false # set to true to require a reviewer before production deploys
      dashboard: {}
      infra-dev: {}
      infra-production:
        approval: true
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  dev-environment:
    description: "My development environment: dotfiles (prompt, aliases, vim) and the dev container base image"
    topics: [devcontainer, dotfiles, docker]
    template: repo-template
    required_checks:
      - "build"
      - "dotfiles"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  repo-template:
    description: "Starting point for new repos: security scans, secret-scanning hook, README skeleton"
    is_template: true
    required_checks:
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  .github:
    description: "The organization's profile page (profile/README.md)"
    template: repo-template
    required_checks:
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  eks-platform:
    description: "A shared EKS cluster, brought up on demand: Karpenter, Argo CD, Airflow and monitoring, all from git"
    topics: [kubernetes, eks, karpenter, argo-cd, gitops, terraform, terragrunt]
    template: repo-template
    # cluster-up.yml runs here: bringing the cluster up costs money, so each run waits for
    # approval. The cluster-lifecycle role trusts this environment and cluster-down.yml on main.
    environments:
      cluster-up:
        approval: true
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "kubernetes / kubeconform"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  data-pipelines:
    description: "Several data pipelines on Airflow in EKS: ingest from the data-simulator API, dbt models on Athena"
    topics: [airflow, dbt, athena, data-engineering, kubernetes]
    template: repo-template
