# Who approves deploys to environments with `approval: true`.
deploy_reviewers:
  - amcaughan

# Each repo gets the org's standard settings and Protected Main (see modules/repositories);
# set only what differs. A new entry creates the repo. To start from the template, add
# `template: repo-template`; add required_checks once its workflows have run on a PR.
repositories:
  data-simulator-api:
    description: "An API designed to be used to simulate generic sorts of data for testing"
    # Both deploy from main only; production also waits for approval. Each environment's
    # AWS deploy role trusts only jobs in that environment.
    environments:
      staging: {}
      production:
        approval: false # set to true to require a reviewer before production deploys
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  data-simulator-elt:
    description: "Pulls the data-simulator API's payments data into S3, hour by hour, for Athena"
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting / formatting"
      - "python / python"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  personal-infra:
    description: "AWS Infra stuff for my personal account"
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "formatting (aws) / formatting"
      - "formatting (github) / formatting"
      - "unit-tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  shared-workflows:
    # Every merge is tagged (v1.2.3) so other repos' Dependabot can bump their pins.
    releases: true
    description: "Reusable GitHub Actions workflows: Python checks, security scans, PR reports"
    # Must pass before merging. Only checks that run on every PR (no path filters).
    required_checks:
      - "actionlint / actionlint"
      - "tests"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  dev-environment:
    description: "My development environment: dotfiles (prompt, aliases, vim) and the dev container base image"
    template: repo-template
    required_checks:
      - "build"
      - "dotfiles"
      - "security / checkov / checkov"
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"

  repo-template:
    description: "Starting point for new repos: security scans, secret-scanning hook, README skeleton"
    is_template: true
    required_checks:
      - "security / trivy / trivy"
      - "security / gitleaks / gitleaks"
      - "security / actionlint / actionlint"
